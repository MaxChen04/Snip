name: CLA
# Asks first-time outside contributors to agree to CLA.md by commenting on
# their PR, and records signatures on the cla-signatures branch. The
# maintainer, and agents acting as the maintainer, are allowlisted.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      # The action writes signatures to this branch but never creates it.
      - name: Create the signatures branch if it's missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          gh api "repos/$REPO/git/ref/heads/cla-signatures" > /dev/null 2>&1 && exit 0
          sha=$(gh api "repos/$REPO/git/ref/heads/$BASE" --jq .object.sha)
          gh api -X POST "repos/$REPO/git/refs" -f ref=refs/heads/cla-signatures -f sha="$sha"
      # Runs only this pinned action; it never checks out or runs PR code.
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/MaxChen04/Snip/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: MaxChen04,dependabot[bot],github-actions[bot],claude[bot],chatgpt-codex-connector[bot]
