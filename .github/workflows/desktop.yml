name: Desktop app
# Keep the native check for application/runtime inputs; documentation-only changes can skip it.
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'capture/**'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'capture/**'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  apple-silicon:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: node -e "if (process.arch !== 'arm64') process.exit(1)"
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run build -w web
      - run: npm run test:app
      - run: npx --no-install playwright install chromium
      - run: node --import tsx --test capture/tests/network.browser.test.ts
      - run: npm run test:desktop
      - run: npm run build --prefix desktop -- --no-install
      - run: codesign --verify --deep --strict desktop/dist/Snip-darwin-arm64/Snip.app
      - name: Build standalone release runtime (unsigned)
        run: |
          export SNIP_NODE_DISTRIBUTION="$(dirname "$(dirname "$(command -v node)")")"
          node desktop/release.mjs --standalone
      - run: node desktop/scripts/release-smoke.cjs
