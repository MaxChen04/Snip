<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Snip</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; height: 100vh; display: grid; place-items: center; font: 14px -apple-system, system-ui, sans-serif; background: #f6f5f2; color: #555; }
      @media (prefers-color-scheme: dark) { body { background: #111; color: #aaa; } }
      main { display: grid; justify-items: center; gap: 16px; }
      img { width: 96px; height: 96px; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <main>
      <img id="logo" alt="" hidden />
      <p id="msg">Starting Snip…</p>
    </main>
    <script>
      const q = new URLSearchParams(location.search)
      if (q.get("msg")) document.getElementById("msg").textContent = q.get("msg")
      const logo = document.getElementById("logo")
      logo.onload = () => (logo.hidden = false)
      if (q.get("logo")) logo.src = q.get("logo")
    </script>
  </body>
</html>
